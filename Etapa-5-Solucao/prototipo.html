<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIGITALIZA — Aprenda tecnologia</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#182b43;background:#f4f7fd}*{box-sizing:border-box}body{margin:0}header{background:#12366a;color:white;padding:18px 5vw}header strong{font-size:1.3em}main{max-width:780px;margin:35px auto;padding:0 20px}.card{background:white;border-radius:18px;padding:30px;box-shadow:0 5px 24px #1e376019}h1{line-height:1.2}p,li{line-height:1.7}.btn,button{border:0;border-radius:10px;background:#1155ae;color:white;font:inherit;font-weight:650;padding:13px 21px;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#dce9ff;color:#15335b}button:focus-visible{outline:4px solid #efac16;outline-offset:3px}.actions{margin-top:22px}#status{font-weight:bold}footer{text-align:center;padding:20px;font-size:.9em;color:#4a5670}body.big{font-size:1.25rem}@media(max-width:500px){.card{padding:20px}button{width:100%}}</style></head><body><header><strong>DIGITALIZA</strong> — Tecnologia ao alcance de todos</header><main><button class="secondary" onclick="document.body.classList.toggle('big')">A+ Ampliar/reduzir texto</button><article id="app" class="card" aria-live="polite"></article></main><footer>Protótipo acadêmico • Sem cadastro e sem armazenamento de dados</footer><script>
const app=document.getElementById('app');let page=0;let answered=false;const pages=[
['Bem-vindo ao DIGITALIZA','Aprender a usar a internet pode ser mais simples. Aqui você encontra orientações rápidas e exemplos para praticar.','Começar',1],
['Escolha uma trilha','Nesta demonstração você vai aprender um pouco sobre navegação e segurança na internet.','Iniciar aula',2],
['Aula 1: conheça o navegador','Um navegador é o aplicativo usado para visitar sites. A barra de endereços mostra o endereço da página. Confira se está no site desejado.','Continuar',3],
['Aula 2: confira os links','Antes de clicar em uma mensagem, observe o endereço e desconfie de promessas urgentes. Se tiver dúvida, procure o canal oficial da organização.','Ver exemplo',4],
['Dica de segurança','Não compartilhe senhas ou códigos recebidos por mensagem. Sites conhecidos também podem ter páginas falsas parecidas.','Praticar',5],
['Quiz: qual opção é mais segura?','Você recebeu uma mensagem dizendo que sua conta será bloqueada em 5 minutos e pedindo para clicar em um link. O que fazer?','',6],
['Você chegou ao final!','Você conheceu algumas orientações básicas. Continue praticando e busque fontes oficiais quando houver dúvidas.','Voltar ao início',0]
];function render(){let a=pages[page];app.innerHTML='<p>Etapa '+(page+1)+' de '+pages.length+'</p><h1>'+a[0]+'</h1><p>'+a[1]+'</p><div class="actions" id="actions"></div><p id="status" role="status"></p>';const ac=document.getElementById('actions');if(page===5){add('Clicar imediatamente',()=>answer(false));add('Abrir o aplicativo oficial por conta própria',()=>answer(true));}else add(a[2],()=>go(a[3]));if(page>0)add('Voltar',()=>go(page-1),true);}function add(label,fn,secondary=false){let b=document.createElement('button');b.textContent=label;if(secondary)b.className='secondary';b.onclick=fn;document.getElementById('actions').append(b);}function answer(right){document.getElementById('status').textContent=right?'Correto! Acesse o serviço pelo aplicativo ou endereço oficial, sem usar links recebidos.':'Mais seguro: não clicar. Abra o aplicativo ou site oficial por conta própria.';if(!document.getElementById('nextquiz')){let b=document.createElement('button');b.id='nextquiz';b.textContent='Finalizar';b.onclick=()=>go(6);document.getElementById('actions').append(b);}}function go(n){page=n;render();window.scrollTo(0,0)}render();
</script></body></html>
