<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIGITALIZA | Aprenda tecnologia no seu ritmo</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#18324e;background:#eff5ff;font-size:16px}*{box-sizing:border-box}body{margin:0;line-height:1.55}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:13px 18px;font-weight:700;background:#1455ba;color:#fff}button:hover{filter:brightness(.94)}button:focus-visible,a:focus-visible{outline:4px solid #e6a500;outline-offset:3px}button.alt{background:#e4efff;color:#153f7a}button.outline{background:transparent;color:#1455ba;border:2px solid #1455ba}header{background:#143b74;color:white;padding:20px max(20px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}header strong{font-size:1.6rem;letter-spacing:.02em}header small{display:block;color:#dceaff}.header-actions{display:flex;gap:8px;flex-wrap:wrap}.header-actions button{background:#fff;color:#143b74;padding:10px 14px}main{max-width:1100px;margin:30px auto;padding:0 20px;min-height:65vh}.card{background:#fff;border:1px solid #dce6f5;border-radius:22px;padding:clamp(22px,4vw,38px);box-shadow:0 8px 28px #142b4910;margin-bottom:20px}.eyebrow{font-size:.87rem;text-transform:uppercase;letter-spacing:.08em;color:#2464ae;font-weight:800}h1{font-size:clamp(1.8rem,4vw,2.65rem);line-height:1.2;margin:10px 0 18px}h2{font-size:1.4rem}p{max-width:78ch}nav{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.tile{text-align:left;width:100%;height:100%;background:#f5f9ff;color:#18324e;border:2px solid #d6e4f5;display:flex;flex-direction:column;gap:9px}.tile:hover{border-color:#1455ba}.tile strong{font-size:1.15rem}.tile span{font-weight:400}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.badge{display:inline-block;border-radius:99px;background:#ddf2e6;color:#195337;padding:5px 11px;font-size:.85rem;font-weight:700}.muted{color:#50647b}.progress{height:14px;background:#dce7f3;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#13885b;transition:width .3s}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.notice{background:#fff6df;border-left:5px solid #d39815;padding:15px;border-radius:9px}.good{background:#e6f6ed;border-color:#249667}#feedback{font-weight:700;margin-top:18px}ol li{margin-bottom:13px}.quizChoice{display:block;width:100%;text-align:left;margin:10px 0;background:#eaf2ff;color:#173d71;border:2px solid transparent}.quizChoice[aria-pressed=true]{border-color:#1455ba}footer{text-align:center;color:#526783;padding:25px}body.large{font-size:20px}body.contrast{background:#fff;color:#000}body.contrast .card{border:2px solid #000;box-shadow:none}body.contrast header{background:#000}body.contrast button{background:#000;color:#fff;border:2px solid #000}body.contrast button.alt,body.contrast .tile{background:#fff;color:#000;border:2px solid #000}@media(max-width:600px){header{padding:18px}main{padding:0 12px}.actions button{flex:1}nav button{flex:1}}
</style></head>
<body><header><div><strong>DIGITALIZA</strong><small>Tecnologia ao alcance de todos</small></div><div class="header-actions"><button id="home">Início</button><button id="font">A+ Texto</button><button id="contrast">◐ Contraste</button></div></header>
<main id="main" tabindex="-1"></main><footer>Projeto acadêmico demonstrativo • Sem cadastro, coleta de dados ou conexão com servidores</footer>
<script>
"use strict";
const courses=[
{id:"internet",icon:"🌐",title:"Primeiros passos na internet",summary:"Entenda os navegadores, endereços e links.",steps:[["O que é um navegador?","É o aplicativo utilizado para abrir páginas da internet, como um portal de notícias ou um site de estudos."],["Onde digitar um endereço?","Procure a barra de endereços na parte superior do navegador. Confira o nome do site antes de continuar."],["Como navegar com calma?","Leia o título da página, observe os botões e use Voltar caso abra uma página diferente da desejada."]],question:"Qual lugar é usado para digitar o endereço de um site?",options:["Barra de endereços","Controle de volume","Lixeira"],answer:0,explain:"A barra de endereços indica a página que está aberta e permite visitar um site."},
{id:"seguranca",icon:"🔐",title:"Segurança digital",summary:"Aprenda a reconhecer mensagens suspeitas.",steps:[["Cuidado com a urgência","Mensagens que exigem uma ação imediata podem ser tentativas de golpe. Não clique por impulso."],["Proteja senhas e códigos","Não compartilhe senhas, códigos de verificação ou dados pessoais em mensagens."],["Confirme pelo canal oficial","Se uma mensagem disser que existe um problema com sua conta, abra o aplicativo oficial por conta própria."]],question:"Uma mensagem ameaça bloquear sua conta e envia um link. O que é mais seguro?",options:["Clicar rapidamente","Enviar sua senha","Abrir o aplicativo oficial sem usar o link"],answer:2,explain:"O caminho mais seguro é abrir o aplicativo ou site oficial sem usar o link da mensagem."},
{id:"email",icon:"✉️",title:"E-mail básico",summary:"Conheça mensagens, assuntos e anexos.",steps:[["O que é o e-mail?","É um serviço para enviar e receber mensagens. Cada pessoa pode ter um endereço eletrônico."],["Assunto e destinatário","Antes de enviar uma mensagem, confira o endereço da pessoa e escreva um assunto que descreva o conteúdo."],["Anexos exigem atenção","Um anexo pode ser uma foto ou documento. Evite abrir arquivos inesperados de remetentes desconhecidos."]],question:"Antes de enviar um e-mail, o que deve ser conferido?",options:["Destinatário e assunto","A bateria do mouse","Somente a cor da tela"],answer:0,explain:"Conferir o destinatário e o assunto ajuda a enviar a mensagem corretamente."},
{id:"celular",icon:"📱",title:"Uso do celular",summary:"Aprenda configurações e cuidados básicos.",steps:[["Conheça as configurações","O aplicativo Configurações permite ajustar brilho, conexão e preferências do aparelho."],["Atualize os aplicativos","As atualizações podem corrigir falhas e melhorar a segurança. Prefira a loja oficial do aparelho."],["Cuide das permissões","Antes de permitir acesso à câmera ou localização, pense se o aplicativo realmente precisa da informação."]],question:"Qual é uma boa prática ao instalar aplicativos?",options:["Aceitar todas as permissões","Usar loja oficial e revisar permissões","Desativar todas as atualizações"],answer:1,explain:"Lojas oficiais e revisão de permissões são cuidados importantes."}
];
let view="home",selected=0,step=0,choice=null;const completed=new Set();const main=document.getElementById("main");
function progress(){return Math.round(completed.size/courses.length*100)}
function btn(label,fn,cls=""){const b=document.createElement("button");b.textContent=label;if(cls)b.className=cls;b.addEventListener("click",fn);return b}
function el(tag,text,cls=""){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function show(node){main.replaceChildren(node);main.focus({preventScroll:true});window.scrollTo({top:0,behavior:"instant"})}
function card(){return el("section",undefined,"card")}
function home(){view="home";const box=card();box.append(el("div","Aprenda no seu ritmo","eyebrow"),el("h1","Um passo de cada vez"),el("p","Aulas rápidas para começar a navegar na internet, cuidar da segurança, usar e-mail e entender seu celular."));const pr=el("div",undefined,"progress");const bar=el("div");bar.style.width=progress()+"%";pr.append(bar);box.append(el("p",completed.size+" de "+courses.length+" trilhas concluídas ("+progress()+"%)"),pr);const section=el("div",undefined,"grid");courses.forEach((c,i)=>{const tile=btn("",()=>start(i),"tile");tile.append(el("strong",c.icon+" "+c.title),el("span",c.summary),el("span",completed.has(c.id)?"✓ Concluída":"Iniciar trilha →","badge"));section.append(tile)});box.append(el("h2","Escolha um assunto"),section);const note=el("p","Seu progresso vale apenas enquanto esta página estiver aberta. Nenhuma informação é enviada ou salva.","muted");box.append(note);show(box)}
function start(i){selected=i;step=0;lesson()}
function lesson(){view="lesson";const c=courses[selected],box=card(),info=c.steps[step];box.append(el("div",c.title+" · passo "+(step+1)+" de "+c.steps.length,"eyebrow"),el("h1",info[0]),el("p",info[1]));const pr=el("div",undefined,"progress");const b=el("div");b.style.width=((step+1)/c.steps.length*100)+"%";pr.append(b);box.append(pr);const nav=el("div",undefined,"actions");nav.append(btn("Voltar",()=>{if(step===0)home();else{step--;lesson()}},"alt"),btn(step===c.steps.length-1?"Praticar agora →":"Próximo passo →",()=>{if(step===c.steps.length-1)quiz();else{step++;lesson()}}));box.append(nav);show(box)}
function quiz(){view="quiz";choice=null;const c=courses[selected],box=card();box.append(el("div","Atividade de fixação","eyebrow"),el("h1",c.question));const choices=el("div");c.options.forEach((o,i)=>{const b=btn(o,()=>{choice=i;[...choices.children].forEach((x,j)=>x.setAttribute("aria-pressed",String(j===i)));submit.disabled=false},"quizChoice");b.setAttribute("aria-pressed","false");choices.append(b)});const feedback=el("div",undefined);feedback.id="feedback";feedback.setAttribute("role","status");const actions=el("div",undefined,"actions");const submit=btn("Conferir resposta",()=>{const ok=choice===c.answer;feedback.textContent=(ok?"Correto! ":"Ainda não. ")+c.explain;if(ok)completed.add(c.id);submit.disabled=true;const next=btn("Finalizar trilha →",()=>finish(ok));actions.append(next)});submit.disabled=true;actions.append(btn("Voltar à aula",lesson,"alt"),submit);box.append(choices,feedback,actions);show(box)}
function finish(ok){view="finish";const box=card();box.append(el("div","Trilha finalizada","eyebrow"),el("h1",ok?"Muito bem!":"Continue praticando!"),el("p",ok?"Você concluiu a atividade. Pode escolher outro assunto e continuar aprendendo.":"Você chegou ao final da aula. Revise a dica e tente novamente para fixar o conteúdo."));const actions=el("div",undefined,"actions");actions.append(btn("Escolher outra trilha",home),btn("Repetir esta trilha",()=>start(selected),"alt"));box.append(actions);show(box)}
document.getElementById("home").onclick=home;document.getElementById("font").onclick=()=>document.body.classList.toggle("large");document.getElementById("contrast").onclick=()=>document.body.classList.toggle("contrast");home();
</script></body></html>
